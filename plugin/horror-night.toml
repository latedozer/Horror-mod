# A Darker Atmosphere plugin. Close the game before editing; changes apply on the next start.
# These are the everyday settings; most can also be changed in game with I Hate TOMLs.
# Every fine-tuning setting (timings, distances, which effects blow, markers) is listed with its
# explanation in horror-night-advanced.toml: copy a line from there into the same [section] here.
# Console (Ctrl + `): "horror status" says what is going on, "horror toggle" switches the plugin.

[plugin]
# Everything the plugin does, at once: storms, lightning, phantoms, whispers. In game it is on a
# key: Options, Controls, under Extensions ("A Darker Atmosphere: on / off", Ctrl + H as shipped).
enabled = true
# The in-game settings menu lists the fine-tuning settings too.
advanced_menu = false

[phantoms]
# False monsters: they cannot be killed, their hits drain life but never kill, and they vanish.
enabled = false
# Seconds between appearances (random between the two), and the most alive at once.
min_interval = 40
max_interval = 120
max_alive = 3
# Each hit takes this percent of your CURRENT life (1-50).
drain_percent = 10

[haunting]
# Now and then a phantom is one of the dead with a townsperson's name: corpses near you get up
# and your life orb reads 1. Percent of appearances (0 = never), most corpses, and the orb.
chance = 5
corpses = 4
false_health = true

[sounds]
# Whispers and other sounds in the dark. Seconds between them (random between the two), loudness 0-300.
enabled = true
min_interval = 70
max_interval = 200
volume = 60

[weather]
# The game's own rain (Acts 1 and 3) and snow (Act 5) always falls outdoors. How heavy: 5-100.
enabled = true
intensity = 100

[storm]
# Lightning and thunder where it rains. Seconds between strikes (random between the two).
enabled = true
min_interval = 15
max_interval = 70
# Thunder loudness, 0-300.
volume = 100
# The sky lights up, and bolts strike the ground near you.
sky_flash = true
lightning_bolts = true
# A strike can hit you: percent of strikes, and the percent of MAXIMUM life it takes (never kills).
direct_hits = true
direct_hit_chance = 6
direct_hit_damage_min = 5
direct_hit_damage_max = 10
# Muffled thunder while underground.
indoor_thunder = true

[rainstorm]
# Wind-blown rain in Act 1: fog hangs in the tree tops and the wind drives past. Lightning is as it was.
enabled = true
# It never stops while you are out in the rain. false = it comes and goes: calm for min_calm to
# max_calm seconds, then blowing for min_length to max_length.
always = true
min_calm = 60
max_calm = 240
min_length = 45
max_length = 120
# What blows past, each part on or off. Fewer parts are lighter on the frame rate.
effect1 = true  # the rain falling on you
effect2 = true  # fog in the tree tops
effect3 = true  # wind
# How far out the blowing field reaches, 0-5. Lower this first if the area runs slowly.
field_radius = 5
# Loudness, 0-300 (0 = none).
wind_volume = 40

[sandstorm]
# Sandstorms in the Act 2 desert.
enabled = true
# It never stops while you are out there. false = sandstorms that come and go: calm for min_calm to
# max_calm seconds, then blowing for min_length to max_length.
always = true
min_calm = 60
max_calm = 240
min_length = 45
max_length = 120
# How far the look goes at its height, 10-100.
strength = 100
# What blows past, each part on or off. Fewer parts are lighter on the frame rate.
effect1 = true  # thin sand
effect2 = true  # huge clouds of sand
effect3 = true  # haze
# How far out the blowing field reaches, 0-5. Lower this first if the area runs slowly.
field_radius = 5
# Loudness, 0-300 (0 = none).
wind_volume = 70
# Dust devils: during a storm a few whirlwinds (devil_min to devil_max of them) stand up around
# you every devil_min_interval to devil_max_interval seconds and wander off. Keep out of them:
# being inside one drains devil_damage percent of your maximum life a second (it never kills;
# 0 = they never hurt).
devils = true
devil_min_interval = 20
devil_max_interval = 50
devil_min = 4
devil_max = 8
devil_damage = 5

[monsoon]
# Monsoons in Act 3. Rain, lightning and thunder carry on in them.
enabled = true
# It never stops while you are out there. false = monsoons that come and go: calm for min_calm to
# max_calm seconds, then blowing for min_length to max_length.
always = true
min_calm = 60
max_calm = 240
min_length = 45
max_length = 120
# How far the look goes at its height, 10-100.
strength = 100
# What blows past, each part on or off. Fewer parts are lighter on the frame rate.
effect1 = true  # the rain falling on you
effect2 = true  # flat fog
effect3 = true  # ground debris
effect4 = true  # blowing leaves
effect5 = true  # more flat fog
effect6 = true  # wide blowing leaves
# How far out the blowing field reaches, 0-5. Lower this first if the area runs slowly.
field_radius = 5
# Loudness, 0-300 (0 = none).
wind_volume = 80
# The lightning lights up the sky during a monsoon too.
sky_flash = true
# The downpour and the jungle at night, and the calls from the jungle now and then.
rain_volume = 90
jungle_volume = 70

[ashstorm]
# Ash storms in Act 4, with meteors.
enabled = true
# It never stops while you are out there. false = ash storms that come and go: calm for min_calm to
# max_calm seconds, then blowing for min_length to max_length.
always = true
min_calm = 60
max_calm = 240
min_length = 45
max_length = 120
# How far the look goes at its height, 10-100.
strength = 100
# What blows past, each part on or off. Fewer parts are lighter on the frame rate.
effect1 = true  # ash and embers
effect2 = true  # fog
effect3 = true  # haze
effect4 = true  # lava glow
effect5 = true  # smoke columns
# How far out the blowing field reaches, 0-5. Lower this first if the area runs slowly.
field_radius = 5
# Loudness, 0-300 (0 = none).
wind_volume = 190
# The fire under the wind, and the steam vents and rockfalls now and then.
fire_volume = 70
burst_volume = 70
# Meteors fall: seconds between volleys (random between the two).
meteors = true
meteor_min_interval = 40
meteor_max_interval = 80
# One can be aimed at you: step out of its marker, or lose this percent of MAXIMUM life (never kills).
meteor_hits = true
meteor_hit_damage_min = 5
meteor_hit_damage_max = 10

[blizzard]
# Blizzards in Act 5, with falling ice in place of the lightning.
enabled = true
# It never stops while you are out there. false = blizzards that come and go: calm for min_calm to
# max_calm seconds, then blowing for min_length to max_length.
always = true
min_calm = 60
max_calm = 240
min_length = 45
max_length = 120
# How far the look goes at its height, 10-100.
strength = 100
# What blows past, each part on or off. Fewer parts are lighter on the frame rate.
effect1 = true  # the snow falling on you
effect2 = true  # drifting snow
effect3 = true  # blowing fog
effect4 = true  # ground haze
effect5 = true  # the ice caves' fog
effect6 = true  # small drifting snow
# How far out the blowing field reaches, 0-5. Lower this first if the area runs slowly.
field_radius = 5
# Loudness, 0-300 (0 = none).
wind_volume = 120
# The mountain wind under the gusts, and the hard gusts now and then.
howl_volume = 70
gust_volume = 80
# Ice falls: seconds between volleys (random between the two).
ice = true
ice_min_interval = 20
ice_max_interval = 60
# One can be aimed at you: step out of its marker, or lose this percent of MAXIMUM life (never kills).
ice_hits = true
ice_hit_damage_min = 5
ice_hit_damage_max = 10
